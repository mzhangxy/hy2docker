name: Build and push images

on:
  workflow_dispatch:    # 手动触发，也可根据需要加上 push、release 等

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write               # 必须的权限，用于推送 ghcr.io 镜像

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 支持多架构（可选，如果你只想 amd64 可以删掉 QEMU 步骤）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 直接用 GitHub Token 登录 ghcr.io（最简洁、最安全的方式）
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 默认就有的 token，无需额外创建

      # 构建并推送
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64   # 只想 amd64 可改为 linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # 如果你的 Dockerfile 不在根目录，可以加 file: ./path/Dockerfile
